---
name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      # Only run when something that can change the result changes. Docs-only
      # pull requests do not need the Go matrix, and the lint, markdown and
      # justfile workflows still run on them. No status check here is required
      # by branch protection, so a skipped run does not block a merge.
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.golangci.yml'
      - '.coverignore'
      - 'justfile'
      - '.mise.toml'
      - '.github/workflows/go.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Report both results. A failure on one version is worth seeing next
      # to a pass on the other.
      fail-fast: false
      matrix:
        go: [ floor, stable ]
    name: build (${{ matrix.go }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The floor is the `go` directive: the oldest release a consumer may
      # build with. Read it from go.mod rather than repeating it here, so
      # moving the directive moves this build with it.
      - name: Set up Go (floor)
        if: matrix.go == 'floor'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Go (stable)
        if: matrix.go == 'stable'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Fetch justfiles
        run: just fetch
      - name: Deps
        run: just deps
      - name: Test
        run: just test

      # One upload per commit. Both jobs produce the same profile, and a
      # second upload reports a different number for the same commit.
      - name: Upload coverage reports to Codecov
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Name the profile explicitly. `just test` filters it through
          # .coverignore; auto-discovery could pick up an unfiltered one and
          # report a different number for the same commit.
          files: .coverage/cover.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
