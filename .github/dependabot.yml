---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore

  # One module: the examples under examples/ are packages of the root module,
  # so a bump of the root moves them too. They were modules of their own, with
  # a replace of the root, and a dependency only in their go.sum was not bumped
  # (osapi-io/gohai#286).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      go-modules:
        group-by: dependency-name
        patterns:
          - "*"
    commit-message:
      prefix: chore
